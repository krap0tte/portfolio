title: "Demo"
description: "Photographe — Portrait · Paysage · Architecture"
baseurl: ""       # laisser vide si déployé sur username.github.io

# Thème
lang: fr

# Collections
collections:
  series:
    output: false

# Build
markdown: kramdown
highlighter: rouge
permalink: pretty
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .gitignore
  - README.md
  - CLAUDE.md
  - bin/

# Sass
sass:
  sass_dir: _sass
  style: compressed
