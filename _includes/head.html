<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}" />
<script>(function(){var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}());</script>
<link rel="preload" href="{{ '/assets/fonts/jost-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="{{ '/assets/fonts/climate-crisis-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
{% if page.url == '/' %}
  {% if jekyll.environment == "production" %}
  <link rel="preload" as="image" href="{{ '/assets/images/cover/cover_phone.webp' | relative_url }}" type="image/webp" media="(max-width: 767px)" />
  <link rel="preload" as="image" href="{{ '/assets/images/cover/cover.webp' | relative_url }}" type="image/webp" media="(min-width: 768px)" />
  {% else %}
  <link rel="preload" as="image" href="{{ '/assets/images/cover/cover_phone.jpg' | relative_url }}" media="(max-width: 767px)" />
  <link rel="preload" as="image" href="{{ '/assets/images/cover/cover.jpg' | relative_url }}" media="(min-width: 768px)" />
  {% endif %}
{% endif %}
