name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install Zola
        env:
          ZOLA_VERSION: 0.22.1
        run: |
          curl -sL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar xz -C /usr/local/bin zola

      # Les miniatures ne sont pas versionnées (.gitignore) : elles sont dérivées
      # des photos, donc reconstruites ici. Le cache est clé sur le contenu des
      # photos — tant qu'aucune n'a changé, l'étape suivante ne fait rien.
      - name: Cache thumbnails
        uses: actions/cache@v4
        with:
          path: static/assets/images/photos/*/*/thumbs
          key: thumbs-${{ hashFiles('static/assets/images/photos/*/*/*.webp') }}

      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Build thumbnails
        run: bin/build-thumbs.sh

      # Doit suivre la génération : zola copie static/ tel quel dans public/.
      - name: Build
        run: zola build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
