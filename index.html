<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galerie — Demo</title>
  <meta name="description" content="Photographe — Portrait · Paysage · Architecture" />
  <!-- Chemins relatifs (jamais de / en tête) : le site se déploie tel quel sous
       un sous-chemin GitHub Pages (username.github.io/portfolio/) sans <base href>. -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <button class="site-header__brand" type="button">Demo</button>
  </header>

  <main class="site-main">
    <!-- Grille : cartes générées par js/gallery.js à partir de la liste PHOTOS. -->
    <section class="gallery-grid">
      <div class="gallery-grid__container"></div>
    </section>

    <div class="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Visionneuse photo">
      <div class="lightbox__stage">
        <div class="lightbox__loader" aria-hidden="true"></div>
        <img class="lightbox__img" alt="" />
      </div>

      <div class="lightbox__controls">
        <p class="lightbox__nav-row">
          <button class="lightbox__link" type="button" data-lb="prev" aria-label="Photo précédente">Précédent</button>
          <span aria-hidden="true"> / </span>
          <button class="lightbox__link" type="button" data-lb="next" aria-label="Photo suivante">Suivant</button>
        </p>
        <button class="lightbox__link" type="button" data-lb="grid" aria-label="Retour à la grille">Grille</button>
      </div>
    </div>
  </main>

  <script src="js/gallery.js"></script>
</body>
</html>
