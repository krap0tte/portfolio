<footer class="site-footer">
  <div class="site-footer__inner container">

    <div>
      <a href="{{ '/' | relative_url }}" class="site-footer__logo">{{ site.title }}</a>
      <p class="site-footer__desc">{{ site.description }}</p>
    </div>

    <div class="site-footer__links">
      <nav aria-label="Liens footer">
        {% for item in site.navigation %}
          <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {% endfor %}
      </nav>
    </div>

    <div class="site-footer__social">
      <!-- Remplacez les # par vos liens -->
      <a href="#" aria-label="Instagram">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4.5"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a href="#" aria-label="500px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M9.5 6.5a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0 4.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/>
          <path d="M20 2H4C2.9 2 2 2.9 2 4v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1.4 14.1c-.4.4-1.1.5-1.5.1l-3.2-3.2c-.6.3-1.2.5-1.9.5-2.5 0-4.5-2-4.5-4.5S9.5 4.5 12 4.5s4.5 2 4.5 4.5c0 .7-.2 1.3-.5 1.9l3.2 3.2c.4.4.3 1.1-.6 2z"/>
        </svg>
      </a>
    </div>

  </div>
  <div class="site-footer__bottom">
    <p>© {{ 'now' | date: "%Y" }} {{ site.title }} — Tous droits réservés</p>
  </div>
</footer>
