architecture: "Exploration des formes géométriques, des matières et des jeux d'ombre propres à l'espace bâti."
paysage: "À la recherche des instants où la lumière naturelle transforme un paysage ordinaire en tableau vivant."
portrait: "Série réalisée en lumière naturelle fenêtre — laisser la lumière dessiner le visage plutôt que de la corriger."
