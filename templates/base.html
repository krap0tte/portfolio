<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}krapotte{% endblock title %}</title>
  <meta name="description" content="{% block description %}Galerie de photographie{% endblock description %}" />
  <link rel="stylesheet" href="{{ get_url(path="css/style.css") }}" />
</head>
<body>
  <header class="site-header">
    <a class="site-header__brand" href="{{ config.base_url | safe }}/">krapotte</a>
    {% set categories_section = get_section(path="categories/_index.md") %}
    {% if categories_section.pages %}
    <nav class="site-header__nav">
      {% for cat in categories_section.pages %}<a class="site-header__nav-link" href="{{ cat.permalink | safe }}">{{ cat.title }}</a>{% endfor %}
    </nav>
    {% endif %}
  </header>

  <main class="site-main">
    {% block main %}
    <section class="gallery-grid">
      <div class="gallery-grid__container"></div>
    </section>

    <div class="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Visionneuse photo">
      <div class="lightbox__stage">
        <div class="lightbox__loader" aria-hidden="true"></div>
        <img class="lightbox__img" alt="" />
      </div>

      <div class="lightbox__controls">
        <p class="lightbox__nav-row">
          <button class="lightbox__link" type="button" data-lb="prev" aria-label="Photo précédente">Précédent</button>
          <span aria-hidden="true"> / </span>
          <button class="lightbox__link" type="button" data-lb="next" aria-label="Photo suivante">Suivant</button>
        </p>
        <button class="lightbox__link" type="button" data-lb="grid" aria-label="Retour à la grille">Grille</button>
      </div>
    </div>
    {% endblock main %}
  </main>

  {% block scripts %}
  <script>
    window.PHOTOS = [{% block photos %}{% endblock photos %}];
  </script>
  <script src="{{ get_url(path="js/gallery.js") }}"></script>
  {% endblock scripts %}
</body>
</html>
