<div class="cover" id="cover" role="region" aria-label="Bienvenue">
  <p class="cover__name" id="cover-name" aria-hidden="true">_krapotte_</p>
  <picture class="cover__picture" id="cover-picture">
    <source srcset="{{ '/assets/images/cover.webp' | relative_url }}" type="image/webp">
    <img class="cover__img" id="cover-img"
         src="{{ '/assets/images/cover.jpg' | relative_url }}"
         alt=""
         fetchpriority="high" />
  </picture>
  <button class="cover__enter" id="cover-enter">Entrer</button>
</div>
