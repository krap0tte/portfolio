<section class="gallery-grid">
  <div class="gallery-grid__container">

    {% if include.photos.size == 0 %}
      <p class="gallery-empty">Ajoutez vos premières photos dans <code>_photos/</code></p>
    {% else %}
      {% for photo in include.photos %}
        <a
          href="{{ photo.url | relative_url }}"
          class="gallery-card"
          data-category="{{ photo.category | slugify | default: 'other' }}"
          data-index="{{ forloop.index0 }}"
        >
          <div class="gallery-card__img-wrap">
            <picture>
              <source srcset="{{ photo.image | replace: '.jpg', '-thumb.webp' | relative_url }}" type="image/webp">
              <source srcset="{{ photo.image | replace: '.jpg', '-thumb.jpg' | relative_url }}">
              <img
                src="{{ photo.image | relative_url }}"
                alt="{{ photo.title }}"
                class="gallery-card__img"
                loading="lazy"
              />
            </picture>
          </div>
        </a>
      {% endfor %}
    {% endif %}

  </div>
</section>

<script type="application/json" id="photo-data">
[{% for photo in include.photos %}{"src":{{ photo.image | relative_url | jsonify }},"webp":{{ photo.image | replace: '.jpg', '.webp' | relative_url | jsonify }},"title":{{ photo.title | jsonify }},"category":{{ photo.category | default: "" | jsonify }},"date":{{ photo.date | date: "%Y" | jsonify }},"location":{{ photo.location | default: "" | jsonify }},"description":{{ photo.description | default: "" | strip | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]
</script>
