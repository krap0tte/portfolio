{% assign img_base = '/assets/images/photos/' | append: include.series_slug | append: '/' | append: include.file %}
<a
  href="{{ img_base | append: '.jpg' | relative_url }}"
  class="gallery-card"
  data-category="{{ include.series_slug }}"
  data-index="{{ include.index }}"
>
  <div class="gallery-card__img-wrap">
    <picture>
      <source srcset="{{ img_base | append: '-thumb.webp' | relative_url }}" type="image/webp">
      <source srcset="{{ img_base | append: '-thumb.jpg' | relative_url }}" type="image/jpeg">
      <img
        src="{{ img_base | append: '-thumb.jpg' | relative_url }}"
        alt=""
        class="gallery-card__img"
        loading="lazy"
      />
    </picture>
  </div>
</a>
