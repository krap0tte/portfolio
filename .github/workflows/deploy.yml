name: Deploy Jekyll to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install image tools
        run: sudo apt-get install -y imagemagick webp

      - name: Optimise images
        run: |
          for src in assets/images/*.jpg; do
            [[ "$src" == *-thumb.jpg ]] && continue
            [ -f "$src" ] || continue
            base="${src%.jpg}"
            # Thumbnail JPEG + WebP (gallery grid)
            convert "$src" -resize "800x800>" -quality 82 -strip "${base}-thumb.jpg"
            cwebp -q 80 "${base}-thumb.jpg" -o "${base}-thumb.webp" -quiet
            # Resize original in-place (lightbox + photo detail — fallback JPEG)
            convert "$src" -resize "1920x1920>" -quality 85 -strip "${src}.opt" && mv "${src}.opt" "$src"
            # Full-size WebP (lightbox + photo detail — modern browsers)
            cwebp -q 82 "$src" -o "${base}.webp" -quiet
            echo "  ✓ $(basename "$src")"
          done

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Minify JavaScript
        run: npx --yes terser _site/assets/js/main.js --compress "passes=2" --mangle --comments false --ecma 2022 --output _site/assets/js/main.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
