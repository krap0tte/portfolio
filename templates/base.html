<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}krapotte{% endblock title %}</title>
  <meta name="description" content="{% block description %}Galerie de photographie{% endblock description %}" />
  <link rel="stylesheet" href="{{ get_url(path="css/style.css") }}" />
</head>
<body>
  {# Le corps entier (header compris) vient de partials/serie.html : la
     navigation entre séries vit dans le header, elle dépend donc de la série
     courante et ne peut pas être figée ici. base.html ne garde que l'enveloppe
     du document et le chargement des scripts. #}
  {% block body %}{% endblock body %}

  <script src="{{ get_url(path="js/gallery.js") }}"></script>
</body>
</html>
