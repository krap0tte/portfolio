<!DOCTYPE html>
<html lang="{{ site.lang | default: 'fr' }}">
<head>
  {% include head.html %}
  <script>(function(){try{new Function('class T{#x}');}catch(e){window.location.replace('{{ "/compat/" | relative_url }}');}})();</script>
</head>
<body>
  {% if page.show_filters %}
    {% assign all_series = site.series | sort: "title" %}
    <div class="filter-bar">
      <button class="filter-bar__all js-filter-all is-active" aria-pressed="true">Tout</button>
      <div class="filter-pill-wrap">
        <button class="filter-pill-wrap__arrow filter-pill-wrap__arrow--prev" aria-hidden="true" tabindex="-1">
          <svg width="6" height="10" viewBox="0 0 6 10" fill="none">
            <path d="M5 1L1 5L5 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <nav class="filter-pill" aria-label="Filtrer par série">
          <span class="filter-pill__indicator" aria-hidden="true"></span>
          {% for s in all_series %}
            <button class="filter-pill__btn" data-series="{{ s.slug }}" aria-pressed="false">{{ s.title }}</button>
          {% endfor %}
        </nav>
        <button class="filter-pill-wrap__arrow filter-pill-wrap__arrow--next" aria-hidden="true" tabindex="-1">
          <svg width="6" height="10" viewBox="0 0 6 10" fill="none">
            <path d="M1 1L5 5L1 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <button class="filter-bar__about" aria-pressed="false">À propos</button>
    </div>
    <button class="filter-mobile-trigger" id="filter-mobile-trigger"
            aria-haspopup="dialog" aria-expanded="false" aria-controls="filter-mobile-menu">
      <span id="filter-mobile-label">Tout</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>
    <div class="filter-mobile-menu" id="filter-mobile-menu"
         role="dialog" aria-modal="true" aria-label="Filtrer par série" aria-hidden="true">
      <div class="filter-mobile-menu__header">
        <span class="filter-mobile-menu__title">Séries</span>
        <button class="filter-mobile-menu__close" id="filter-mobile-close" aria-label="Fermer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <nav class="filter-mobile-menu__list">
        <button class="filter-pill__btn js-filter-all is-active" aria-pressed="true">Tout</button>
        {% for s in all_series %}
          <button class="filter-pill__btn" data-series="{{ s.slug }}" aria-pressed="false">{{ s.title }}</button>
        {% endfor %}
      </nav>
      <button class="filter-mobile-menu__about" id="filter-mobile-about">À propos</button>
    </div>
  {% endif %}
  <main class="site-main">{{ content }}</main>
  <footer class="site-footer" id="about">
    <p class="site-footer__name">{{ site.title }}</p>
    <p class="site-footer__description">{{ site.description }}</p>
    <a class="site-footer__compat" href="{{ '/compat/' | relative_url }}">Version allégée</a>
  </footer>
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
