<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}" />
<script>(function(){var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}());</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Climate+Crisis&family=Instrument+Serif:ital@0;1&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
{% if page.url == '/' %}
  <link rel="preload" as="image"
        href="{{ '/assets/images/cover.webp' | relative_url }}"
        type="image/webp" />
{% endif %}
{% seo %}
