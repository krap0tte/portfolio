<div class="cover" id="cover" role="region" aria-label="Bienvenue">
  <p class="cover__name" id="cover-name" aria-hidden="true">_krapotte_</p>
  <picture class="cover__picture" id="cover-picture">
    {% if jekyll.environment == "production" %}
    <source media="(max-width: 767px)" srcset="{{ '/assets/images/cover/cover_phone.webp' | relative_url }}" type="image/webp">
    {% endif %}
    <source media="(max-width: 767px)" srcset="{{ '/assets/images/cover/cover_phone.jpg' | relative_url }}">
    {% if jekyll.environment == "production" %}
    <source srcset="{{ '/assets/images/cover/cover.webp' | relative_url }}" type="image/webp">
    {% endif %}
    <img class="cover__img" id="cover-img"
         src="{{ '/assets/images/cover/cover.jpg' | relative_url }}"
         alt=""
         fetchpriority="high" />
  </picture>
  <button class="cover__enter" id="cover-enter">Entrer</button>
</div>
