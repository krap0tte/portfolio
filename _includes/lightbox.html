<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Visionneuse photo">

  <button class="lightbox__close" id="lightbox-close" aria-label="Fermer">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <path d="M18 6L6 18M6 6l12 12"/>
    </svg>
  </button>

  <div class="lightbox__stage" id="lightbox-stage">
    <div class="lightbox__loader" id="lightbox-loader" aria-hidden="true"></div>

    <button class="lightbox__nav lightbox__nav--prev" id="lightbox-prev" aria-label="Photo précédente">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <img class="lightbox__img" id="lightbox-img" alt="" />

    <button class="lightbox__nav lightbox__nav--next" id="lightbox-next" aria-label="Photo suivante">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>
  </div>

</div>
