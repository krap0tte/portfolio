<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galerie — Demo</title>
  <meta name="description" content="Photographe — Portrait · Paysage · Architecture" />
  <!-- Pas de &lt;link rel=preload&gt; pour les fontes : leur url() SCSS passe par le
       pipeline d'assets d'esbuild (hachage de contenu), le nom de fichier final
       n'est donc pas prévisible depuis ce document statique. font-display: block
       évite déjà tout flash visuel ; seul le début du fetch serait avancé. -->
  <!-- Preload des covers WebP de production : en dev les fichiers n'existent pas
       (le composant sert les JPEG) — seul un avertissement console apparaît. -->
  <link rel="preload" as="image" href="assets/images/cover/cover_phone.webp" type="image/webp" media="(max-width: 767px)" />
  <link rel="preload" as="image" href="assets/images/cover/cover.webp" imagesrcset="assets/images/cover/cover.webp 1x, assets/images/cover/cover-2x.webp 2x" type="image/webp" media="(min-width: 768px)" />
</head>
<body>
  <app-root></app-root>
</body>
</html>
