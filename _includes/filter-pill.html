<nav class="filter-pill" aria-label="Filtrer par série">
  <span class="filter-pill__indicator" aria-hidden="true"></span>
  {% for cat in include.categories %}
    <button class="filter-pill__btn{% if forloop.first %} is-active{% endif %}" data-filter="{{ cat | slugify }}">{{ cat }}</button>
  {% endfor %}
</nav>
